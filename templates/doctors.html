{% extends 'base.html' %}
{%load static%}

{% block content %}
<div class="heading-bg3">
    <br>
   <h2 class="text-center">Our Doctors</h2>
   <br>
</div>
<div class="doctors-bg">
  <div class="container" style="background-color: #e3f2fd;">
        <div class="text-center">
   
          {% for d in doctors %}

           <div class="card text-center mx-3 my-3"
               style="width: 18rem; display:inline-block">

              <img src="{{ d.doc_image.url }}" class="card-img-top" alt="...">

                <div class="card-body">
                     <h5 class="card-title">Dr. {{ d.doc_name }}</h5>
                     <p class="card-text">{{ d.doc_spec }}</p>
                    <h6>{{ d.dep_name }} Department</h6>
                </div>

            </div>

          {% endfor %}

        </div>
 
    </div>
</div>

{% endblock %}
